<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ванная 378 × 257 — 3D, итерация 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --viewport:#DCE1DF; --panel:#F7F8F6; --ink:#1E2624; --muted:#5B6864; --line:#C6CFCC;
  --accent:#2E6F73; --accent-ink:#FFFFFF; --chip:#EAEEEC; --label-bg:rgba(247,248,246,.9); --label-ink:#1E2624;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --viewport:#1A201F; --panel:#242B2A; --ink:#E4EBE9; --muted:#9AA8A4; --line:#3A4644;
    --accent:#7FC2C1; --accent-ink:#0F1918; --chip:#2E3736; --label-bg:rgba(36,43,42,.9); --label-ink:#E4EBE9;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --viewport:#1A201F; --panel:#242B2A; --ink:#E4EBE9; --muted:#9AA8A4; --line:#3A4644;
  --accent:#7FC2C1; --accent-ink:#0F1918; --chip:#2E3736; --label-bg:rgba(36,43,42,.9); --label-ink:#E4EBE9;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--viewport);color:var(--ink);
  font-family:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;overflow:hidden}
#stage{position:relative;width:100%;height:100%}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;
  font-size:12px;font-weight:500;color:var(--label-ink);background:var(--label-bg);
  padding:3px 8px;border-radius:6px;border:1px solid var(--line);margin-top:-6px}
.lbl.dim{background:transparent;border:none;font-weight:600;color:var(--accent);font-size:13px}
.hide-labels #labels{display:none}

#panel{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;width:292px;max-height:calc(100% - 28px);
  overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px}
#panel header{display:flex;align-items:flex-start;gap:8px}
#panel h1{font-size:19px;line-height:1.2;font-weight:600;margin:0;letter-spacing:-.01em}
#panel .sub{margin:4px 0 0;color:var(--muted);font-size:13px}
#panel h2{font-size:13px;font-weight:600;margin:16px 0 8px;color:var(--muted)}
#collapse{margin-left:auto;flex:none}
.btns{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;font-size:13px;color:var(--ink);background:var(--chip);border:1px solid transparent;
  border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--line)}
button[aria-pressed="true"],button[aria-checked="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pal button{display:flex;align-items:center;gap:8px;width:100%;text-align:left}
.sw{display:inline-flex;flex:none;border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.sw i{display:block;width:12px;height:18px}
.pal{display:grid;gap:6px}
label.tg{display:flex;align-items:center;gap:8px;font-size:14px;padding:3px 0;cursor:pointer}
label.tg input{width:16px;height:16px;accent-color:var(--accent)}
.hint{margin:14px 0 0;font-size:12px;color:var(--muted)}
.collapsed #panel .body{display:none}
#err{position:absolute;inset:auto 14px 14px 14px;background:#8a2b2b;color:#fff;padding:10px 14px;border-radius:10px;font-size:14px}
@media (max-width:640px){
  #panel{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:10px;right:10px;width:auto;max-height:52%}
  .views{flex-wrap:nowrap;overflow-x:auto}
  .views button{flex:none}
}
</style>
</head>
<body>
<div id="stage"><div id="labels" aria-hidden="true"></div></div>

<aside id="panel" aria-label="Настройки модели">
  <header>
    <div>
      <h1>Ванная комната</h1>
      <p class="sub">378 × 257 см, потолок 290. Итерация 2: тумба 120, шкаф, LED-лента.</p>
    </div>
    <button id="collapse" aria-expanded="true">Свернуть</button>
  </header>
  <div class="body">
    <h2>Камера</h2>
    <div class="btns views" role="group" aria-label="Готовые ракурсы">
      <button data-view="over" aria-pressed="true">Обзор</button>
      <button data-view="back" aria-pressed="false">С другой стороны</button>
      <button data-view="plan" aria-pressed="false">План</button>
      <button data-view="door" aria-pressed="false">От двери</button>
      <button data-view="vanity" aria-pressed="false">От раковин</button>
    </div>

    <h2>Отделка</h2>
    <div class="pal" role="radiogroup" aria-label="Палитра отделки" id="pal"></div>

    <h2>Показать</h2>
    <label class="tg"><input type="checkbox" id="tgLabels" checked> Подписи и размеры</label>
    <label class="tg"><input type="checkbox" id="tgCurtain" checked> Шторка в душе</label>
    <label class="tg"><input type="checkbox" id="tgLed" checked> LED-лента у потолка</label>
    <label class="tg"><input type="checkbox" id="tgDoor"> Дверь открыта</label>

    <p class="hint">Мышь: левая кнопка вращает, правая сдвигает, колесо приближает. На телефоне: один палец вращает, двумя пальцами масштаб и сдвиг. Стены, которые закрывают обзор, прячутся сами.</p>
  </div>
</aside>
<div id="err" hidden></div>

<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
<script src="lib/RoomEnvironment.js"></script>
<script src="lib/Reflector.js"></script>
<script>
(function(){
'use strict';
const errBox = document.getElementById('err');
function showErr(msg){ errBox.hidden = false; errBox.textContent = msg; }
window.addEventListener('error', e => showErr('Ошибка в модели: ' + (e.message || e)));
if (!window.THREE) { showErr('Не удалось загрузить библиотеку three.js. Проверьте интернет и обновите страницу.'); return; }
if (THREE.ColorManagement) THREE.ColorManagement.legacyMode = false;

/* ---------- Все размеры в сантиметрах ---------- */
const C = {
  W: 378, D: 257, H: 290,              // комната: x вдоль 378, z вдоль 257, высота
  tOut: 38, tIn: 12,                    // наружная стена (слева) и перегородки
  win:  { u0: 115, w: 51, sill: 90, h: 125, proj: 4, reveal: 25 },    // окно в левой стене, подоконник выступает на 4 см
  door: { z0: 82, w: 78, h: 210, leaf: 70 },                           // дверь в правой стене
  box:  { x1: 160, d: 20, h: 120 },     // короб инсталляции
  wc:   50, bidet: 110,                 // оси унитаза и биде от левой стены
  van:  { x0: 160, w: 120, d: 48, bottom: 45, top: 85 },
  cab:  { x0: 329.5, d: 48, bottom: 15, top: 225 },        // подвесной шкаф в углу у двери
  mir:  { cx: 220, w: 110, h: 80, bottom: 110 },
  tub:  { x0: 198, z0: 167, L: 180, B: 90, rim: 58 },
  sh:   { x1: 130, z0: 157 },           // душ: x 0..130, z 157..257
  dry:  { x0: 140, w: 50, h: 80, bottom: 90 }
};
const PI = Math.PI, V3 = THREE.Vector3;
let vw = 0, vh = 0;

const PALETTES = {
  stone:    { name:'Светлый камень', wall:'#E6E2DA', wallVein:'#B7AEA2', grout:'#D3CDC3', floor:'#C8C1B5', floorVein:'#988E81', floorGrout:'#B2AA9E', wood:'#A27A52', top:'#EEEAE3', metal:'chrome' },
  concrete: { name:'Тёплый бетон',   wall:'#C9C3B9', wallVein:'#A29B90', grout:'#B6B0A6', floor:'#8C867F', floorVein:'#6C6760', floorGrout:'#78726B', wood:'#C6A47B', top:'#B8B2A9', metal:'black' },
  galala:   { name:'Мрамор Galala', wall:'#E4D7C1', wallVein:'#BFA683', grout:'#DDD0BA', floor:'#DCCDB3', floorVein:'#B2976F', floorGrout:'#CDBFA6', wood:'#DCC8AC', top:'#EADFCC', metal:'chrome', marble:true, rough:.18, lacquer:true }
};
const METALS = {
  chrome: { color:'#D9DBDD', metalness:1, roughness:.12 },
  black:  { color:'#2A2A2A', metalness:.35, roughness:.5 },
  brass:  { color:'#C29C5E', metalness:1, roughness:.3 }
};

/* ---------- Рендерер ---------- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0x000000, 0);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = .82;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.insertBefore(renderer.domElement, stage.firstChild);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 1, 6000);

if (THREE.RoomEnvironment) {
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(new THREE.RoomEnvironment(), 0.04).texture;
}

/* ---------- Текстуры ---------- */
function rng(seed){ let s = seed % 2147483647; if (s <= 0) s += 2147483646; return () => (s = s * 16807 % 2147483647) / 2147483647; }
function tileTexture(tw, th, base, vein, grout, seed, marble){
  const k = 8, cw = Math.round(tw*k), ch = Math.round(th*k);
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const g = c.getContext('2d'), r = rng(seed);
  g.fillStyle = base; g.fillRect(0,0,cw,ch);
  for (let i=0;i<700;i++){ g.globalAlpha = .035*r(); g.fillStyle = r()>.5 ? vein : '#FFFFFF';
    g.beginPath(); g.arc(r()*cw, r()*ch, 6+r()*46, 0, 2*PI); g.fill(); }
  g.strokeStyle = vein;
  for (let j=0;j<4;j++){ g.globalAlpha = .12 + r()*.12; g.lineWidth = .6 + r()*1.4; g.beginPath();
    let x = r()*cw, y = 0; g.moveTo(x,y);
    while (y < ch){ x += (r()-.5)*46; y += 18 + r()*30; g.lineTo(x,y); } g.stroke(); }
  if (marble){
    // Galala: мягкие размытые прожилки и мелкие вкрапления-окаменелости
    g.filter = 'blur(2px)'; g.strokeStyle = vein;
    for (let j=0;j<6;j++){ g.globalAlpha = .08 + r()*.1; g.lineWidth = 3 + r()*6; g.beginPath();
      let x = r()*cw, y = r()*ch*.3; g.moveTo(x,y);
      while (y < ch){ x += (r()-.35)*60; y += 30 + r()*50; g.lineTo(x,y); } g.stroke(); }
    g.filter = 'none';
    for (let i=0;i<420;i++){ g.globalAlpha = .12 + r()*.3; g.fillStyle = r() > .3 ? vein : '#FFF8EC';
      g.beginPath(); g.ellipse(r()*cw, r()*ch, .6 + r()*2.6, .6 + r()*1.6, r()*PI, 0, 2*PI); g.fill(); }
  }
  g.globalAlpha = 1; g.strokeStyle = grout; g.lineWidth = 4; g.strokeRect(0,0,cw,ch);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1/tw, 1/th);
  t.encoding = THREE.sRGBEncoding; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
function woodTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d'), r = rng(7);
  g.fillStyle = '#FFFFFF'; g.fillRect(0,0,512,512);
  for (let i=0;i<150;i++){ const y = r()*512, a = r()*3;
    g.strokeStyle = 'rgba(80,55,30,' + (0.03 + r()*0.09).toFixed(3) + ')'; g.lineWidth = .5 + r()*2.4;
    g.beginPath(); g.moveTo(0,y); for (let x=0;x<=512;x+=32) g.lineTo(x, y + Math.sin(x/80 + i)*a); g.stroke(); }
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
}
function glowTexture(){
  const c = document.createElement('canvas'); c.width = 400; c.height = 240;
  const g = c.getContext('2d');
  g.shadowColor = 'rgba(255,232,196,1)'; g.shadowBlur = 34; g.fillStyle = 'rgba(255,232,196,1)';
  g.fillRect(40, 40, 320, 160);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
}

/* ---------- Материалы ---------- */
const std = o => new THREE.MeshStandardMaterial(o);
const M = {
  wallTile:  std({ color:'#FFFFFF', roughness:.45 }),
  floorTile: std({ color:'#FFFFFF', roughness:.45 }),
  plaster:   std({ color:'#D7D3CB', roughness:.95 }),
  dark:      std({ color:'#5A5856', roughness:.9 }),
  ceramic:   std({ color:'#F7F7F5', roughness:.12 }),
  ceramicDS: std({ color:'#F7F7F5', roughness:.12, side:THREE.DoubleSide }),
  tubIn:     std({ color:'#F4F4F2', roughness:.18, side:THREE.BackSide }),
  bowlIn:    std({ color:'#D9DCDD', roughness:.2 }),
  metal:     std({ color:'#D9DBDD', metalness:1, roughness:.12 }),
  wood:      std({ color:'#A27A52', roughness:.62, map: woodTexture() }),
  woodDark:  std({ color:'#715538', roughness:.7 }),
  top:       std({ color:'#EEEAE3', roughness:.28 }),
  pvc:       std({ color:'#F4F4F2', roughness:.4 }),
  leaf:      std({ color:'#EDEBE6', roughness:.5 }),
  ceiling:   std({ color:'#F6F6F4', roughness:1 }),
  glass:     new THREE.MeshPhysicalMaterial({ color:'#E8F0F0', roughness:.4, metalness:0, transparent:true, opacity:.42, depthWrite:false, side:THREE.DoubleSide }),
  winGlass:  new THREE.MeshPhysicalMaterial({ color:'#CFE2EA', roughness:.05, metalness:0, transparent:true, opacity:.2, depthWrite:false, side:THREE.DoubleSide }),
  curtain:   std({ color:'#F3F1EC', roughness:.9, transparent:true, opacity:.62, side:THREE.DoubleSide, depthWrite:false }),
  led:       new THREE.MeshBasicMaterial({ color:'#FFF1DA' }),
  glow:      new THREE.MeshBasicMaterial({ map: glowTexture(), transparent:true, depthWrite:false })
};
Object.values(M).forEach(m => { if (m.isMeshStandardMaterial && m !== M.metal) m.envMapIntensity = .5; });
function replaceMap(mat, tex){ if (mat.map) mat.map.dispose(); mat.map = tex; mat.needsUpdate = true; }
function applyPalette(key){
  const p = PALETTES[key];
  replaceMap(M.wallTile,  tileTexture(60, 120, p.wall,  p.wallVein,  p.grout, 11, p.marble));
  replaceMap(M.floorTile, tileTexture(120, 60, p.floor, p.floorVein, p.floorGrout, 23, p.marble));
  M.wallTile.roughness = p.rough || .45; M.floorTile.roughness = p.rough ? p.rough + .1 : .45;
  M.wood.color.set(p.wood);
  if (!applyPalette.woodTex) applyPalette.woodTex = M.wood.map;
  M.wood.map = p.lacquer ? null : applyPalette.woodTex;          // глянец без текстуры дерева
  M.wood.roughness = p.lacquer ? .1 : .62; M.wood.needsUpdate = true;
  M.woodDark.color.set(p.wood).multiplyScalar(.62);
  M.top.color.set(p.top);
  const m = METALS[p.metal];
  M.metal.color.set(m.color); M.metal.metalness = m.metalness; M.metal.roughness = m.roughness;
}

/* ---------- Геометрические помощники ---------- */
function poly(pts, holes){
  const s = new THREE.Shape(); s.moveTo(pts[0][0], pts[0][1]);
  for (let i=1;i<pts.length;i++) s.lineTo(pts[i][0], pts[i][1]); s.closePath();
  (holes||[]).forEach(h => { const p = new THREE.Path(); p.moveTo(h[0][0], h[0][1]);
    for (let i=1;i<h.length;i++) p.lineTo(h[i][0], h[i][1]); p.closePath(); s.holes.push(p); });
  return s;
}
const rect = (x,y,w,h) => [[x,y],[x+w,y],[x+w,y+h],[x,y+h]];
function roundRect(x,y,w,h,r){
  const s = new THREE.Shape();
  s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+h-r); s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h); s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y); return s;
}
// Ставит объект на плоскость стены: локальный x идёт вдоль стены (u), y вверх, +z в комнату.
function place(o, wall, off){
  switch (wall){
    case 'N': o.position.set(0, 0, off);            o.rotation.set(0, 0, 0); break;      // u = x
    case 'S': o.position.set(C.W, 0, C.D - off);    o.rotation.set(0, PI, 0); break;     // u = W - x
    case 'W': o.position.set(off, 0, C.D);          o.rotation.set(0, PI/2, 0); break;   // u = D - z
    case 'E': o.position.set(C.W - off, 0, 0);      o.rotation.set(0, -PI/2, 0); break;  // u = z
  }
  return o;
}
function onWall(parent, wall, u, v, child){
  const g = new THREE.Group(); place(g, wall, 0);
  child.position.set(u, v, child.position.z); g.add(child); parent.add(g); return g;
}
function box(x0,x1,y0,y1,z0,z1,mat){
  const m = new THREE.Mesh(new THREE.BoxGeometry(x1-x0, y1-y0, z1-z0), mat);
  m.position.set((x0+x1)/2, (y0+y1)/2, (z0+z1)/2); return m;
}
function cyl(r, len, mat, axis, seg){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg || 20), mat);
  if (axis === 'x') m.rotation.z = PI/2; if (axis === 'z') m.rotation.x = PI/2; return m;
}
function tiled(shape, mat, wall, off){
  const m = new THREE.Mesh(new THREE.ShapeGeometry(shape, 24), mat); m.receiveShadow = true; return place(m, wall, off);
}

/* ---------- Стены ---------- */
const walls = {};
function makeWall(id, faceShape, masShape, thick, normal, point){
  const g = new THREE.Group();
  g.add(tiled(faceShape, M.wallTile, id, .15));
  const mas = new THREE.Mesh(new THREE.ExtrudeGeometry(masShape, { depth: thick, bevelEnabled:false }), M.plaster);
  place(mas, id, -thick); g.add(mas);
  scene.add(g); walls[id] = { g, n: normal, p: point }; return g;
}
const winHole   = rect(C.win.u0, C.win.sill, C.win.w, C.win.h);  // u = D - z
const nicheHole = rect(25, 105, 50, 30);
makeWall('W', poly(rect(0,0,C.D,C.H), [winHole, nicheHole]),
              poly(rect(-C.tIn,0,C.D+2*C.tIn,C.H), [winHole, nicheHole]), C.tOut, new V3(1,0,0), new V3(0,0,0));
const dz0 = C.door.z0, dz1 = C.door.z0 + C.door.w;
makeWall('E', poly([[0,0],[dz0,0],[dz0,C.door.h],[dz1,C.door.h],[dz1,0],[C.D,0],[C.D,C.H],[0,C.H]]),
              poly([[-C.tIn,0],[dz0,0],[dz0,C.door.h],[dz1,C.door.h],[dz1,0],[C.D+C.tIn,0],[C.D+C.tIn,C.H],[-C.tIn,C.H]]),
              C.tIn, new V3(-1,0,0), new V3(C.W,0,0));
makeWall('N', poly(rect(0,0,C.W,C.H)), poly(rect(0,0,C.W,C.H)), C.tIn, new V3(0,0,1), new V3(0,0,0));
makeWall('S', poly(rect(0,0,C.W,C.H)), poly(rect(0,0,C.W,C.H)), C.tIn, new V3(0,0,-1), new V3(0,0,C.D));

// Пол
const floor = new THREE.Mesh(new THREE.ShapeGeometry(poly(rect(0,0,C.W,C.D))), M.floorTile);
floor.rotation.x = -PI/2; floor.position.set(0, 0, C.D); floor.receiveShadow = true; scene.add(floor);

// Потолок, светильники, датчик движения
const ceil = new THREE.Group(); scene.add(ceil);
const cplane = new THREE.Mesh(new THREE.PlaneGeometry(C.W, C.D), M.ceiling);
cplane.rotation.x = PI/2; cplane.position.set(C.W/2, C.H, C.D/2); ceil.add(cplane);
const SPOTS = [[65,207],[288,212],[190,62],[250,62],[80,85],[175,120]];
SPOTS.forEach(([x,z]) => {
  const d = new THREE.Mesh(new THREE.CircleGeometry(4, 24), M.led);
  d.rotation.x = PI/2; d.position.set(x, C.H - .1, z); ceil.add(d);
  const l = new THREE.PointLight(0xFFF0DA, .16, 520, 1); l.position.set(x, C.H - 12, z); scene.add(l);
});
const sensor = new THREE.Mesh(new THREE.SphereGeometry(4, 20, 10, 0, 2*PI, 0, PI/2), M.pvc);
sensor.rotation.x = PI; sensor.position.set(10, C.H, 10); ceil.add(sensor);

// LED-лента в углу потолка вдоль стены с ванной и душем
const ledGrp = new THREE.Group(); walls.S.g.add(ledGrp);

function panShape(hw, len){
  const s = new THREE.Shape(), st = len * .45;
  s.moveTo(-hw, 0); s.lineTo(hw, 0); s.lineTo(hw, st); s.absellipse(0, st, hw, len - st, 0, PI, false); s.lineTo(-hw, 0);
  return s;
}
function extrudeDown(shape, depth, bevel, mat, bottomY){
  const geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 4, curveSegments: 36 });
  const m = new THREE.Mesh(geo, mat); m.rotation.x = PI/2; m.position.y = bottomY + depth + bevel; return m;
}

const tmp = new V3();
function updateLabels(w, h){
  if (document.body.classList.contains('hide-labels')) return;
  labels.forEach(l => {
    if ((l.wall && !walls[l.wall].g.visible)) { l.el.style.display = 'none'; return; }

const center = new V3(C.W/2, 70, C.D/2);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = .08; controls.minDistance = 10; controls.maxDistance = 2500;
controls.target.copy(center);

function viewDef(name){
  const a = Math.max(vw / Math.max(vh, 1), .3), tf = Math.tan(camera.fov * PI / 360);
  const k = (a < 1.2 ? Math.pow(1.2 / a, .75) : 1) * 1.12;
  switch (name){
    case 'over':   return { pos: new V3(C.W/2 + 330*k, 430*k, C.D/2 + 380*k), tgt: center.clone() };
    case 'back':   return { pos: new V3(C.W/2 - 330*k, 430*k, C.D/2 - 380*k), tgt: center.clone() };
    case 'plan': {
      const dist = Math.max((C.D + 70) / (2*tf), (C.W + 90) / (2*tf*a)) + C.H;
      return { pos: new V3(C.W/2, dist, C.D/2 + .5), tgt: new V3(C.W/2, 0, C.D/2) };
    }
    case 'door':   return { pos: new V3(C.W - 12, 162, (dz0 + dz1)/2), tgt: new V3(110, 112, 150) };
    case 'vanity': return { pos: new V3(305, 164, 58), tgt: new V3(95, 95, 215) };
  }
}
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let tween = null;
function goTo(name, instant){
  const d = viewDef(name);
  if (instant || reduceMotion){ camera.position.copy(d.pos); controls.target.copy(d.tgt); tween = null; controls.update(); return; }
  tween = { t0: performance.now(), dur: 750, p0: camera.position.clone(), q0: controls.target.clone(), p1: d.pos, q1: d.tgt };
}
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('[data-view]').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
  goTo(b.dataset.view);
}));
controls.addEventListener('start', () => { tween = null; });

/* ---------- Панель ---------- */
const palBox = document.getElementById('pal');
Object.keys(PALETTES).forEach((key, i) => {
  const p = PALETTES[key], b = document.createElement('button');
  b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', i === 0 ? 'true' : 'false'); b.dataset.pal = key;
  b.innerHTML = '<span class="sw"><i style="background:' + p.wall + '"></i><i style="background:' + p.floor + '"></i><i style="background:' + p.wood + '"></i><i style="background:' + METALS[p.metal].color + '"></i></span>';
  b.appendChild(document.createTextNode(p.name));
  b.addEventListener('click', () => {
    palBox.querySelectorAll('button').forEach(x => x.setAttribute('aria-checked', x === b ? 'true' : 'false'));
    applyPalette(key);
  });
  palBox.appendChild(b);
});
document.getElementById('tgLabels').addEventListener('change', e => document.body.classList.toggle('hide-labels', !e.target.checked));
document.getElementById('tgCurtain').addEventListener('change', e => { curtain.visible = e.target.checked; });
document.getElementById('tgLed').addEventListener('change', e => { ledGrp.visible = ledLights.visible = e.target.checked; });
let doorTarget = 0, doorAngle = 0;
document.getElementById('tgDoor').addEventListener('change', e => { doorTarget = e.target.checked ? 75 * PI / 180 : 0; });
const col = document.getElementById('collapse');
col.addEventListener('click', () => {
  const c = document.body.classList.toggle('collapsed');
  col.setAttribute('aria-expanded', c ? 'false' : 'true'); col.textContent = c ? 'Развернуть' : 'Свернуть';
  if (typeof resize === 'function' && vw) resize();
});
if (window.innerWidth < 640) col.click();

/* ---------- Цикл ---------- */
function resize(){
  vw = stage.clientWidth; vh = stage.clientHeight;
  renderer.setSize(vw, vh, false);
  const panel = document.getElementById('panel');
  const pw = (vw > 640 && !document.body.classList.contains('collapsed')) ? panel.offsetWidth + 14 : 0;
  camera.aspect = (vw + pw) / Math.max(vh, 1);
  if (pw) camera.setViewOffset(vw + pw, vh, 0, 0, vw, vh); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();
applyPalette('stone');
goTo('over', true);

const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
const rel = new V3();
function frame(now){
  if (tween){
    const k = Math.min(1, (now - tween.t0) / tween.dur), e = ease(k);
    camera.position.lerpVectors(tween.p0, tween.p1, e); controls.target.lerpVectors(tween.q0, tween.q1, e);
    if (k >= 1) tween = null;
  }
  controls.update();
  Object.keys(walls).forEach(id => { const w = walls[id]; rel.subVectors(camera.position, w.p); w.g.visible = rel.dot(w.n) > -1; });
  ceil.visible = camera.position.y < C.H - 1;
  doorAngle += (doorTarget - doorAngle) * (reduceMotion ? 1 : .12);
  doorPivot.rotation.y = doorAngle;
  renderer.render(scene, camera);
  updateLabels(vw, vh);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__ready = true;
})();
</script>
